name: Publish Package to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "leu-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
          install: true

      - run: pnpm run build
      - name: Publish to npm
        run: pnpm publish
